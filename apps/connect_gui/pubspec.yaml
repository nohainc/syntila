name: syntila_connect_gui
description: Syntila Connect desktop app. Built from the GUI Manifest of syntila-connect.
publish_to: none
version: 0.2.1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.40.0"

dependencies:
  flutter:
    sdk: flutter
  syntila_design:
    path: ../../packages/syntila_design
  gui_manifest_flutter:
    git:
      url: https://github.com/nohainc/gui-manifest.git
      ref: 242b71c88cc11c90a0fad0886467ae2db4a366ef
      path: gui/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
