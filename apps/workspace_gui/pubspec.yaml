name: syntila_workspace_gui
description: Syntila Workspace desktop GUI, rendered from `syntila --gui-manifest`.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.40.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  syntila_design:
    path: ../../packages/syntila_design
  # Local development uses pubspec_overrides.yaml (untracked) to point at a
  # gui-manifest checkout; see README.
  gui_manifest_flutter:
    git:
      url: https://github.com/nohainc/gui-manifest.git
      path: gui/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
