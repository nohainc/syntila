name: syntila_workspace
description: Syntila Workspace headless service and CLI.
publish_to: none
version: 1.0.18

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.0
  archive: ^4.3.0
  syntila_protocol:
    path: ../../packages/dart/protocol
  syntila_worker_protocol:
    path: ../../packages/syntila_worker_protocol
  syntila_tool_profile_v1:
    path: ../../packages/tool_profile_v1
  syntila_cli_worker_runtime:
    path: ../../packages/syntila_cli_worker_runtime
  syntila_plugin_protocol:
    path: ../../packages/syntila_plugin_protocol
  syntila_mcp_protocol:
    path: ../../packages/syntila_mcp_protocol
  cryptography: ^2.9.0
  nanomarkup: ^1.0.0
  # CLI command metadata, help and --gui-manifest; pinned to a commit.
  gui_manifest:
    git:
      url: https://github.com/nohainc/gui-manifest.git
      path: sdk/dart
      ref: 242b71c88cc11c90a0fad0886467ae2db4a366ef

dev_dependencies:
  lints: ^5.0.0
  fake_async: ^1.3.1
  test: ^1.25.0
