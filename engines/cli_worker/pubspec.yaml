name: syntila_cli_worker_engine
description: Generic isolated CLI Worker Engine for Syntila.
publish_to: none
version: 1.4.0

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  json_schema: ^5.2.1
  syntila_cli_worker_runtime:
    path: ../../packages/syntila_cli_worker_runtime
  syntila_worker_protocol:
    path: ../../packages/syntila_worker_protocol
  syntila_external_worker_protocol:
    path: ../../packages/syntila_external_worker_protocol
  syntila_mcp_protocol:
    path: ../../packages/syntila_mcp_protocol
  syntila_external_worker_conformance:
    path: ../../packages/syntila_external_worker_conformance
  syntila_tool_profile_v1:
    path: ../../packages/tool_profile_v1

dev_dependencies:
  test: ^1.25.0
