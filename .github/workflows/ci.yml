name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plugin_acceptance_only:
        description: Run only plugin resource acceptance on Linux and Windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: ${{ !inputs.plugin_acceptance_only }}
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cloud: ${{ steps.detect.outputs.cloud }}
      dart: ${{ steps.detect.outputs.dart }}
      app: ${{ steps.detect.outputs.app }}
      workspace: ${{ steps.detect.outputs.workspace }}
      workspace_gui: ${{ steps.detect.outputs.workspace_gui }}
      profile_lab: ${{ steps.detect.outputs.profile_lab }}
      engine: ${{ steps.detect.outputs.engine }}
      site: ${{ steps.detect.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/detect-changes.sh

  static:
    if: ${{ !inputs.plugin_acceptance_only }}
    name: Repository static guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-flutter
      - name: Run static checks
        run: pnpm check:static

  cloud:
    name: Cloud and TypeScript packages
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Type-check and test cloud and packages
        run: pnpm check:typescript

  dart-packages:
    name: Dart packages
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Check Dart packages
        run: bash scripts/check-dart-packages.sh

  app:
    name: AX web app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Validate AX web app
        run: bash scripts/check-flutter-app.sh app
      - name: Build web bundle
        working-directory: apps/app
        run: flutter build web --release --dart-define=SYNTILA_API_URL=/api

  workspace:
    name: Workspace
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          install: "false"
      - uses: ./.github/actions/setup-flutter
      - name: Validate Workspace
        run: bash scripts/check-flutter-app.sh workspace

  workspace-gui:
    name: Workspace GUI
    needs: changes
    if: needs.changes.outputs.workspace_gui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Validate Workspace GUI
        run: bash scripts/check-flutter-app.sh workspace_gui

  profile-lab:
    name: Profile Lab
    needs: changes
    if: needs.changes.outputs.profile_lab == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          install: "false"
      - uses: ./.github/actions/setup-flutter
      - name: Validate Profile Lab
        run: bash scripts/check-flutter-app.sh profile_lab

  engine:
    name: Worker engine and runtime packages
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Validate Worker engine
        run: bash scripts/validate-engine.sh
      - name: Validate plugin author tools and CI filters
        run: node --test scripts/plugin-author-kit.test.mjs scripts/sign-plugin.test.mjs scripts/ci/detect-changes.test.mjs
      - name: Build plugin author kit
        run: node scripts/build-plugin-author-kit.mjs
      - name: Retain plugin author kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-author-kit
          path: dist/plugin-author-kit/*
          if-no-files-found: error

  plugin-resource-acceptance:
    name: Plugin resources (${{ matrix.runner }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_acceptance_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Resolve focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          for package in packages/syntila_plugin_protocol packages/syntila_plugin_conformance engines/cli_worker; do
            (cd "$package" && dart pub get)
          done
      - name: Verify native and observed resource limits
        shell: bash
        working-directory: engines/cli_worker
        run: |
          set -euo pipefail
          dart test --reporter expanded test/plugin_process_limits_test.dart test/plugin_resource_monitor_test.dart test/plugin_windows_handles_test.dart | tee "$RUNNER_TEMP/plugin-resource-tests.log"
      - name: Retain resource acceptance log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-resources-${{ matrix.runner }}
          path: ${{ runner.temp }}/plugin-resource-tests.log
          if-no-files-found: warn

  plugin-limits-windows:
    name: Plugin resource limits on Windows
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Verify inherited Windows job limits
        shell: pwsh
        working-directory: engines/cli_worker
        run: |
          dart pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart test test/plugin_process_limits_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  site:
    name: Public site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/check-site

  ci-passed:
    name: ${{ inputs.plugin_acceptance_only && 'Plugin resource acceptance passed' || 'CI passed' }}
    if: always()
    needs:
      [
        changes,
        static,
        cloud,
        dart-packages,
        app,
        workspace,
        workspace-gui,
        profile-lab,
        engine,
        plugin-limits-windows,
        plugin-resource-acceptance,
        site,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped by its path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if ! echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
            echo "$NEEDS" | jq .
            exit 1
          fi
          echo "All required CI jobs passed."
