name: Build Connect for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-connect-build
  cancel-in-progress: false

jobs:
  read-version:
    name: Read Connect version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Connect version
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2; exit}' apps/connect/pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and package Windows Connect (installer + portable zip)
    needs: read-version
    runs-on: windows-2022
    environment: connect-windows-release
    timeout-minutes: 75
    env:
      SYNTILA_CONNECT_VERSION: ${{ needs.read-version.outputs.version }}
      # Releases never fall back to the compile-only CI trust root.
      SYNTILA_PROFILE_TRUST_ROOTS: ${{ vars.SYNTILA_PROFILE_TRUST_ROOTS }}
      SYNTILA_UPDATE_KEYS: ${{ vars.SYNTILA_UPDATE_KEYS || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-flutter
      - name: Require release configuration
        shell: pwsh
        run: |
          if (-not $env:SYNTILA_PROFILE_TRUST_ROOTS) { throw 'vars.SYNTILA_PROFILE_TRUST_ROOTS is required.' }
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch.' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compilerDir`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Compiler installation failed: $($install.ExitCode)" }
      - name: Run Connect CLI tests
        shell: pwsh
        run: |
          # The Engine tests run the Engine from source, which needs its own packages resolved.
          Push-Location engines/cli_worker
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location apps/connect
          dart pub get
          dart test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Build Windows Connect bundle and portable archive
        shell: pwsh
        run: ./scripts/build-connect-windows.ps1 -Production
      - name: Check Connect GUI icon
        shell: pwsh
        run: |
          $gui = Join-Path $env:GITHUB_WORKSPACE 'dist/connect/windows/release/Syntila Connect.exe'
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($gui)
          if ($null -eq $icon) { throw 'Connect GUI executable has no icon.' }
          $icon.Dispose()
      - name: Build Inno Setup installer
        shell: pwsh
        run: ./scripts/package-connect-windows.ps1 -Compiler "$env:RUNNER_TEMP/inno-setup/ISCC.exe"
      - name: Test install, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-connect-windows-installer.ps1
      - name: Write checksums
        shell: pwsh
        run: |
          $files = @(Get-Item "dist/connect/installer/Syntila-Connect-$env:SYNTILA_CONNECT_VERSION-windows-x64-Setup.exe",
                             "dist/connect/Syntila-Connect-$env:SYNTILA_CONNECT_VERSION-windows-x64-portable.zip")
          New-Item -ItemType Directory -Force dist/windows-release | Out-Null
          $files | Copy-Item -Destination dist/windows-release
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/windows-release/SHA256SUMS -Encoding ascii
      - name: Record build metadata
        shell: pwsh
        run: |
          @{ version = $env:SYNTILA_CONNECT_VERSION; commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID } |
            ConvertTo-Json -Compress | Set-Content dist/windows-release/build.json -Encoding utf8
          "Unsigned Windows build: available for testing and release." >> $env:GITHUB_STEP_SUMMARY
      - name: Retain build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntila-connect-windows-x64-release
          path: dist/windows-release/*
          if-no-files-found: error

