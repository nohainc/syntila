name: Release Connect for Windows

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Connect for Windows run ID
        type: string
        required: true
      release_notes:
        description: Release notes for the GitHub Release
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-connect-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish selected Windows build
    runs-on: ubuntu-24.04
    environment: connect-windows-release
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify selected build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Release must run from main.' >&2; exit 1; }
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Build run ID must be numeric.' >&2; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-connect-windows.yml" --jq '.id')"
          jq -e --argjson workflow_id "$workflow_id" '
            .workflow_id == $workflow_id and .event == "workflow_dispatch" and
            .head_branch == "main" and .status == "completed" and .conclusion == "success"
          ' <<< "$run" >/dev/null || { echo 'Selected run is not a successful manual Windows build on main.' >&2; exit 1; }
          sha="$(jq -r '.head_sha' <<< "$run")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Download selected build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: gh run download "$BUILD_RUN_ID" --name syntila-connect-windows-x64-release --dir release
      - name: Verify artifacts and create release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          version="$(jq -r --arg sha "$BUILD_SHA" --arg run "$BUILD_RUN_ID" \
            'select(.commit == $sha and .run_id == $run) | .version' release/build.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Build metadata is invalid.' >&2; exit 1; }
          installer="Syntila-Connect-$version-windows-x64-Setup.exe"
          portable="Syntila-Connect-$version-windows-x64-portable.zip"
          # Require exactly the expected entries, so checksum verification covers both assets.
          expected="$(printf '%s\n' "$installer" "$portable" | sort)"
          actual="$(awk '{print $2}' release/SHA256SUMS | sort)"
          [[ "$actual" == "$expected" ]] || { echo 'Unexpected checksum entries.' >&2; exit 1; }
          (cd release && sha256sum --strict -c SHA256SUMS)
          tag="connect-windows-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; Windows releases are immutable." >&2
            exit 1
          fi
          gh release create "$tag" "release/$installer" "release/$portable" release/SHA256SUMS --target "$BUILD_SHA" \
            --title "Syntila Connect $version for Windows" \
            --notes "${NOTES:-Unsigned Syntila Connect $version for Windows x64 (installer and portable archive).}"
