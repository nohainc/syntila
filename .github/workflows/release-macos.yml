name: Workspace / macOS / Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed metadata, a GitHub release, and the Homebrew Cask (main and passing CI required)
        type: boolean
        default: false
      channel:
        description: Release channel
        type: choice
        options: [development, beta, stable]
        default: development
      release_notes:
        description: Release notes included in signed metadata
        type: string
        required: false

permissions:
  contents: read

jobs:
  require-ci:
    name: Require passing CI on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Workspace version
        id: version
        run: |
          version="$(awk '/^version:/ {print $2; exit}' apps/workspace/pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for publishing
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/require-ci-success.sh

  workspace:
    name: Syntila Workspace (signed and notarized)
    needs: require-ci
    runs-on: macos-15
    environment: workspace-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-flutter

      - name: Configure Developer ID and notarization
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.SYNTILA_MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.SYNTILA_MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.SYNTILA_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.SYNTILA_APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.SYNTILA_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12" && test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/syntila-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          CERT_PATH="$RUNNER_TEMP/syntila-developer-id.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$IDENTITY"
          echo "SYNTILA_MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials syntila-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN_PATH"
          echo 'SYNTILA_MACOS_NOTARY_PROFILE=syntila-notary' >> "$GITHUB_ENV"

      - name: Run Workspace analysis and tests
        run: bash scripts/check-flutter-app.sh workspace

      - name: Build, sign, and notarize Workspace
        env:
          SYNTILA_WORKSPACE_VERSION: ${{ needs.require-ci.outputs.version }}
          SYNTILA_RELEASE_TRUST_KEYS_JSON: ${{ vars.SYNTILA_RELEASE_TRUST_KEYS_JSON }}
        run: bash scripts/build-workspace-macos.sh --prod

      - name: Verify notarized app archive
        env:
          WORKSPACE_VERSION: ${{ needs.require-ci.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/syntila/macos/Syntila-Workspace-$WORKSPACE_VERSION-macos.zip"
          mkdir -p "$RUNNER_TEMP/workspace-bundle-check"
          ditto -x -k "$ARCHIVE" "$RUNNER_TEMP/workspace-bundle-check"
          BUNDLE="$RUNNER_TEMP/workspace-bundle-check/syntila"
          bash scripts/verify-workspace-service-bundle.sh "$BUNDLE"
          # Bare executables are not assessable by spctl; require a Developer ID signature.
          codesign -dv --verbose=4 "$BUNDLE/syntila" 2>&1 | grep -q "Authority=Developer ID Application"
          codesign -dv --verbose=4 "$BUNDLE/assets/engines/syntila-agent" 2>&1 | grep -q "Authority=Developer ID Application"
          APP="$BUNDLE/Syntila Workspace.app"
          codesign --verify --strict --deep "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application"
          spctl --assess --type execute "$APP"
          xcrun stapler validate "$APP"

      - name: Retain verified Workspace archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntila-workspace-macos-release
          path: dist/syntila/macos/Syntila-Workspace-${{ needs.require-ci.outputs.version }}-macos.zip
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true

  publish:
    name: Publish Workspace and Homebrew Cask
    if: inputs.publish
    needs: [require-ci, workspace]
    runs-on: macos-15
    environment: workspace-release
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download verified Workspace archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name syntila-workspace-macos-release --dir release
      - name: Publish and verify immutable Workspace metadata
        env:
          WORKSPACE_ARCHIVE: release/Syntila-Workspace-${{ needs.require-ci.outputs.version }}-macos.zip
          WORKSPACE_VERSION: ${{ needs.require-ci.outputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CLOUD_API_URL: ${{ vars.CLOUD_API_URL }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.SYNTILA_RELEASE_PUBLISH_TOKEN }}
          SYNTILA_WORKSPACE_SIGNING_SEED: ${{ secrets.SYNTILA_WORKSPACE_ED25519_SEED }}
          SYNTILA_WORKSPACE_SIGNING_KEY_ID: ${{ vars.SYNTILA_WORKSPACE_SIGNING_KEY_ID }}
          SYNTILA_RELEASE_TRUST_KEYS_JSON: ${{ vars.SYNTILA_RELEASE_TRUST_KEYS_JSON }}
        run: node scripts/release/publish-workspace-release.mjs
      - name: Create or verify the immutable GitHub release archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.require-ci.outputs.version }}
        run: |
          set -euo pipefail
          archive="release/Syntila-Workspace-$VERSION-macos.zip"
          tag="workspace-macos-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern "$(basename "$archive")" --dir existing
            test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$(shasum -a 256 "existing/$(basename "$archive")" | awk '{print $1}')"
          else
            gh release create "$tag" "$archive" --target "$GITHUB_SHA" \
              --title "Syntila Workspace $VERSION for macOS" \
              --notes "Signed and notarized Syntila Workspace $VERSION for macOS."
          fi
      - name: Check Homebrew tap access
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.SYNTILA_HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN"
      - name: Check out the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nohainc/homebrew-tap
          ref: main
          token: ${{ secrets.SYNTILA_HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Write and validate the Homebrew Cask
        env:
          VERSION: ${{ needs.require-ci.outputs.version }}
          OUTPUT: homebrew-tap/Casks/syntila-workspace.rb
        run: |
          set -euo pipefail
          # hashFiles is unavailable to shell scripts; compute the archive digest here.
          archive_sha256="$(shasum -a 256 "release/Syntila-Workspace-$VERSION-macos.zip" | awk '{print $1}')"
          export SHA256="$archive_sha256"
          node scripts/release/write-homebrew-workspace-cask.mjs
          ruby -c homebrew-tap/Casks/syntila-workspace.rb
      - name: Publish the Homebrew Cask
        env:
          VERSION: ${{ needs.require-ci.outputs.version }}
        run: |
          set -euo pipefail
          git -C homebrew-tap config user.name "Syntila Releases"
          git -C homebrew-tap config user.email "releases@syntila.app"
          git -C homebrew-tap add Casks/syntila-workspace.rb
          if git -C homebrew-tap diff --cached --quiet; then
            exit 0
          fi
          git -C homebrew-tap commit -m "Publish Syntila Workspace $VERSION"
          git -C homebrew-tap push origin main
