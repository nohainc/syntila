packages:
  # Keep pnpm limited to TypeScript packages. Dart and Flutter projects use
  # their native package managers and are intentionally not workspace entries.
  - packages/worker-agent-protocol
  - packages/core
  - packages/email
  - packages/tool-profile
  - packages/protocol
  - packages/security
  - apps/cloud
  - apps/backend
  - apps/site

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
